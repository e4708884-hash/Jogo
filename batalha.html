<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teste 3D</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #222;
        }

        #mensagem {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 10;
            color: white;
            background: #000;
            padding: 10px;
            font-family: Arial;
        }
    </style>
</head>

<body>
    <div id="avisoPaisagem">
    <div>
        <div class="iconeGirar">↻</div>
        <h2>Gire o celular</h2>
        <p>Sky Dominion foi feito para jogar na horizontal.</p>
    </div>
</div>
 
 <script type="module">

import * as THREE from "./three.module.min.js";

// ============================
// CENA
// ============================

const cena = new THREE.Scene();

const carregador = new THREE.TextureLoader();

carregador.load("./ceu.jpg", function(textura) {

    const geometriaCeu =
        new THREE.PlaneGeometry(1000, 500);

    const materialCeu =
        new THREE.MeshBasicMaterial({
            map: textura,
            side: THREE.DoubleSide
        });

    const ceu =
        new THREE.Mesh(
            geometriaCeu,
            materialCeu
        );

    ceu.position.set(0, 180, -400);

    cena.add(ceu);

});

// ============================
// CÂMERA
// ============================

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 65, 120);
camera.lookAt(0, 0, 0);

// ============================
// RENDERIZADOR
// ============================

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(renderer.domElement);


// ============================
// LUZ
// ============================

const luz = new THREE.DirectionalLight(
    0xffffff,
    3
);

luz.position.set(10, 30, 10);

cena.add(luz);


const luzAmbiente = new THREE.AmbientLight(
    0xffffff,
    1
);

cena.add(luzAmbiente);


// ============================
// CHÃO
// ============================

const geometriaChao =
    new THREE.PlaneGeometry(200, 200);
    
const materialChao =
    new THREE.MeshStandardMaterial({
        color: 0x3f7d3f
    });

const chao =
    new THREE.Mesh(
        geometriaChao,
        materialChao
    );

chao.rotation.x = -Math.PI / 2;

cena.add(chao);


// ============================
// LINHAS DO MAPA
// ============================

const grid =
    new THREE.GridHelper(
        200,
        100
    );

cena.add(grid);


// ============================
// ANIMAÇÃO
// ============================

function animar() {

    requestAnimationFrame(animar);

    renderer.render(
        cena,
        camera
    );
}

animar();


// ============================
// REDIMENSIONAMENTO
// ============================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
